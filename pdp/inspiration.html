      // and let the home logotype settle back at once rather than easing in over most of a second
      if (on) savedY = scrollY;
      menu.classList.toggle('open', on); menu.inert = !on; open = on;
      document.documentElement.classList.toggle('menu-open', on);
      [].forEach.call(document.body.children, function (c) { if (c !== menu && c.tagName !== 'SCRIPT') c.inert = on; });
      btn.setAttribute('aria-expanded', on); document.documentElement.style.overflow = on ? 'hidden' : '';
      if (!on) {
        if (savedY !== null && Math.abs(scrollY - savedY) > 1) scrollTo(0, savedY);
        document.body.classList.add('logo-still');
        dispatchEvent(new Event('scroll'));
        setTimeout(function () { document.body.classList.remove('logo-still'); }, 700);
      }
      if (on && keyboard) menu.querySelector('a').focus();
    }
    var open = false, savedY = 0;
    // tapping the pushed-over page closes the menu
    document.addEventListener('click', function (e) { if (open && !menu.contains(e.target) && e.target !== btn) set(false); });
    btn.addEventListener('click', function (e) { e.preventDefault(); keyboard = e.detail === 0; set(true); });          // focus the first link only for keyboard users, so a tap shows no outline
    menu.querySelector('.menu-close').addEventListener('click', function () { set(false); btn.focus(); });
    addEventListener('keydown', function (e) { if (e.key === 'Escape' && open) { set(false); btn.focus(); } });
    // widened past the phone layout with the drawer open: the desktop nav takes over, so close it
    var wide = matchMedia('(min-width:768px)');
    var toWide = function (e) { if (e.matches && open) set(false); };
    if (wide.addEventListener) wide.addEventListener('change', toWide); else wide.addListener(toWide);

    // Choosing a page: the drawer stays put and the new page loads behind it
    menu.addEventListener('click', function (e) {
      var a = e.target.closest('a'); if (!a) return;
      var to = new URL(a.href, location.href);
      if (to.pathname !== location.pathname && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
        // another page: the page behind the drawer dims to white, then the next one loads beneath the drawer
        e.preventDefault();
        try { sessionStorage.setItem('macon-menu', '1'); sessionStorage.setItem('macon-fade', '1'); } catch (err) {}
        var dim = document.createElement('div');
        dim.style.cssText = 'position:fixed;inset:0;z-index:59;background:#fff;pointer-events:none;opacity:0;transition:opacity 300ms cubic-bezier(.4,0,.6,1)';
        document.body.appendChild(dim);
        requestAnimationFrame(function () { requestAnimationFrame(function () { dim.style.opacity = '1'; }); });
        setTimeout(function () { location.href = a.href; }, 310);
        return;
      }
      if (to.pathname === location.pathname) {          // same page (Shop from the home page): close first, then move
        e.preventDefault();
        set(false);
        var target = to.hash && document.querySelector(to.hash);
        // moving while the page is still pushed aside makes the home film draw over the grid for a moment
        if (target) setTimeout(function () {
          target.scrollIntoView({behavior: 'smooth', block: 'start'});
          history.replaceState(null, '', to.hash);
        }, 620);
        return;
      }
      try { sessionStorage.setItem('macon-menu', '1'); } catch (err) {}
    });
    // ...where it arrives already open, and slides closed once the page is ready
    var root = document.documentElement;
    if (root.classList.contains('menu-arriving')) {
      try { sessionStorage.removeItem('macon-menu'); } catch (err) {}
      menu.classList.add('instant');
      set(true);
      savedY = null;          // a page arriving goes where its link points (Shop lands on the grid), never back to where it started
      root.classList.remove('menu-arriving');
      var closed = false;
      var close = function () {
        if (closed) return; closed = true;
        // in one frame: were it closed a frame after "instant" came off, the still-open drawer
        // would restart its words' rise-in for that frame and they would blink out
        requestAnimationFrame(function () { menu.classList.remove('instant'); set(false); });
      };
      if (document.readyState === 'complete') setTimeout(close, 150);
      else addEventListener('load', function () { setTimeout(close, 150); });
      setTimeout(close, 1600);          // never held open waiting on a slow picture
    }
  })();

  // ── Soft fade between pages ───────────────────────────────────────────
  // Leaving, the page dims to white in 300ms; the next one lifts out of white in 450ms (see the head script).
  // Kept brief and low-contrast so it smooths the cut rather than being seen. Not for the phone drawer,
  // which swaps pages behind itself, and not for Back/Forward.
  (function () {
    var FADE_ON = true;                            // flip to false to go back to plain cuts
    if (!FADE_ON || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var veil = null;
    addEventListener('click', function (e) {
      if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      var a = e.target.closest && e.target.closest('a[href]');
      if (!a || a.closest('.menu-sheet') || a.target === '_blank' || a.hasAttribute('download')) return;
      var href = a.getAttribute('href') || '';
      if (!href || href[0] === '#' || /^(mailto:|tel:|javascript:)/i.test(href)) return;
      var to = new URL(a.href, location.href);
      if (to.origin !== location.origin || (to.pathname === location.pathname && to.search === location.search)) return;
      e.preventDefault();
      veil = veil || document.createElement('div');
      veil.style.cssText = 'position:fixed;inset:0;z-index:2147482000;background:#fff;pointer-events:none;opacity:0;transition:opacity 300ms cubic-bezier(.4,0,.6,1)';
      document.body.appendChild(veil);
      requestAnimationFrame(function () { requestAnimationFrame(function () { veil.style.opacity = '1'; }); });
      try { sessionStorage.setItem('macon-fade', '1'); } catch (err) {}
      setTimeout(function () { location.href = a.href; }, 310);
    }, true);
    // coming back through history: never leave the veil up
    addEventListener('pageshow', function (e) { if (e.persisted && veil) veil.remove(); try { sessionStorage.removeItem('macon-fade'); } catch (err) {} });
  })();

  // ── Page wipe ─────────────────────────────────────────────────────────
  // One opaque panel crosses the screen in a single direction: it drops from
  // above to cover the page, the page is swapped while it is hidden, and the
  // panel carries on off the bottom to uncover the new one. Because it never
  // retreats the way it came, it reads as something passing over the page
  // rather than a shutter opening and closing.
  (function () {
    var ON = false;                               // the wipe is parked: flip to true to bring it back
    var COVER = 420, KEY = 'macon-wipe';          // matches the 420ms cover in the head          // the reveal half runs from the head
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    function panel() {
      var el = document.querySelector('.wipe');
      if (!el) { el = document.createElement('div'); el.className = 'wipe'; document.body.appendChild(el); }
      return el;
    }

    function leaves(a) {
      if (!a || a.target === '_blank' || a.hasAttribute('download')) return false;
      var href = a.getAttribute('href') || '';
      if (!href || href[0] === '#' || /^(mailto:|tel:|javascript:)/i.test(href)) return false;
      var url = new URL(a.href, location.href);
      if (url.origin !== location.origin) return false;
      return url.pathname !== location.pathname || url.search !== location.search;
    }

    // the wipe is kept for one journey only: leaving a piece for the home page,
    // whether by the logotype, the Shop link or the Back arrow
    function home(a) {
      if (!document.body.hasAttribute('data-slug')) return false;
      var to = new URL(a.href, location.href).pathname;
      return /(^|\/)index\.html$/.test(to) || /\/$/.test(to);
    }

    addEventListener('click', function (e) {
      if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      var a = e.target.closest && e.target.closest('a[href]');
      if (!leaves(a)) return;
      if (document.body.classList.contains('ed-on')) return;          // never while editing
      if (!ON || !home(a)) return;                                           // only the walk back from a piece to the shop
      e.preventDefault();
      var el = panel();
      requestAnimationFrame(function () { el.classList.add('cover'); });
      try { sessionStorage.setItem(KEY, '1'); } catch (err) {}
      setTimeout(function () { location.href = a.href; }, COVER);     // swapped while it cannot be seen
    }, true);

    // coming back through history: never leave the panel sitting over the page
    addEventListener('pageshow', function (e) {
      if (!e.persisted) return;
      var el = document.querySelector('.wipe'); if (el) el.remove();
      try { sessionStorage.removeItem(KEY); } catch (err) {}
    });
  })();
</script>
</body>
</html>
