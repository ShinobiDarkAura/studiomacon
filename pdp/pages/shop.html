<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop | Studio Maçon</title>
<link rel="icon" href="../assets/favicon.png">
<link rel="stylesheet" href="site.css?v={{CSSV}}">
<style>
  /* the film fills the first screen; the nav sits over it in white */
  .film{position:relative;height:100vh;height:100svh;overflow:hidden;background:#111}
  .film video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  /* scroll cue: a mouse outline with a dot that drifts down and fades, on a slow loop */
  .scroll-cue{position:absolute;left:50%;bottom:64px;scale:1.2;transform-origin:bottom center;z-index:2;width:22px;height:34px;margin-left:-11px;
    border:1px solid rgba(255,255,255,.4);border-radius:11px;pointer-events:none;transition:opacity .5s ease}
  .scroll-cue i{position:absolute;left:50%;top:7px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#fff;
    animation:cue 2.8s cubic-bezier(.45,0,.25,1) infinite}
  @keyframes cue{
    0%{transform:translateY(0);opacity:0;filter:blur(0)}
    15%{opacity:1}
    55%{transform:translateY(10px);opacity:1;filter:blur(0)}
    80%{transform:translateY(13px);opacity:0;filter:blur(1.5px)}
    100%{transform:translateY(13px);opacity:0}
  }
  .film.scrolled .scroll-cue{opacity:0}
  @media (prefers-reduced-motion:reduce){ .scroll-cue i{animation:none} }
  .wall-head{display:flex;align-items:baseline;gap:10px;padding:25vh calc(var(--pad) + 12px) 24px}
  .wall-head.next-set{padding-top:0}
  .set:first-of-type::after{content:"";display:block;height:calc(120px + 10vh)}
  /* each section title rides along under the nav until the next section's title pushes it off */
  .set{position:relative}
  /* FOLLOWING TITLES — switched off. To bring them back, add class="follow-titles" to <body> below. */
  body:not(.follow-titles) .wall-head{position:relative !important;top:auto !important}
  .wall-head{position:sticky;z-index:6;top:calc(var(--head) - 25vh);pointer-events:none;transition:color .35s ease}
  /* riding over the pictures, the title is white type with nothing behind it */
  .wall-head.compact{color:#fff}
  .wall-head.compact .count{color:rgba(255,255,255,.7)}
  /* riding titles step in 32px, with a hairline running in from the page edge to just before the word */
  .wall-head h1,.wall-head .count{transition:transform .45s var(--ease),font-size .45s var(--ease),color .35s ease}
  .wall-head h1{position:relative}
  .wall-head h1::before{content:"";position:absolute;top:50%;right:calc(100% + 8px);height:1px;background:currentColor;
    width:calc(var(--pad) + 12px + 32px - 8px);transform:scaleX(0);transform-origin:left;transition:transform .45s var(--ease)}
  .wall-head.compact h1,.wall-head.compact .count{transform:translateX(32px)}
  .wall-head.compact h1::before{transform:scaleX(1)}
  .wall-head.next-set{top:var(--head)}
  .placeholder-fill{position:absolute;inset:0;background:#e6e6e4}
  .placeholder{position:relative;aspect-ratio:4/5;background:#d9d9d9;overflow:hidden}
  .placeholder img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .wall-head h1{margin:0;font-size:57.5px;transition:font-size .45s var(--ease)}
  .wall-head{transition:padding-bottom .45s var(--ease)}
  /* once a title is riding under the nav it shrinks, and its white strip with it */
  @media (min-width:768px){
    .wall-head.compact h1{font-size:46.375px !important}
  }
  @media (min-width:1200px){ .wall-head.compact h1{font-size:52.5px !important} }
  .wall-head .count{font-size:13px;color:rgba(0,0,0,.45)}
  @media (min-width:768px){ .wall-head h1{font-size:66.25px} }
  @media (min-width:1200px){ .wall-head h1{font-size:75px} }

  .wall{display:grid;grid-template-columns:1fr;gap:12px;padding:0 calc(var(--pad) + 12px)}
  .wall figure{margin:0;border-radius:6px;overflow:hidden;background:var(--field)}
  .wall figure.dr-emerge{filter:none;transform:translateY(90px);
    transition:opacity .7s ease,transform .9s cubic-bezier(.2,1.25,.35,1);transition-delay:var(--stagger,0ms)}
  .wall figure.dr-emerge.is-seen{transform:none}
  @media (min-width:600px){ .wall{grid-template-columns:repeat(2,1fr)} }
  @media (min-width:900px){ .wall{grid-template-columns:repeat(3,1fr)} }

  /* each piece: the photograph, with name and price rising in at the bottom on hover */
  .piece{position:relative;display:block;color:#fff;aspect-ratio:4/5;overflow:hidden}
  /* every tile the same frame; the in-hand photograph fades in over it on hover */
  .piece img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.7,.2,1),opacity .5s ease}
  .piece .held{opacity:0}
  .piece:hover .held,.piece:focus-visible .held{opacity:1}
  .piece .over{position:absolute;inset:auto 0 0 0;display:flex;flex-direction:column;align-items:flex-start;gap:8px;
    padding:48px 18px 16px;font-size:15px;
    background:linear-gradient(to top,rgba(0,0,0,.45),rgba(0,0,0,0));
    opacity:0;transform:translateY(10px);transition:opacity .35s ease,transform .45s var(--ease)}
  .piece .over{z-index:1}
  .piece .cost{order:-1}
  .piece .name{font:400 calc(49.5px - 4pt)/.95 var(--serif);text-transform:uppercase;letter-spacing:.01em}
  .piece:hover .over,.piece:focus-visible .over{opacity:1;transform:none}
  .piece:hover img{transform:scale(1.02)}
  @media (hover:none){ .piece .held{display:none} }
  /* no hover on touch screens, so the details are always shown there */
  @media (hover:none){ .piece .over{opacity:1;transform:none} }
</style>
</head>
<body>

{{NAV}}

<main>
  <section class="film" aria-label="Studio Maçon film">
    <video autoplay muted loop playsinline preload="auto" poster="video/poster.jpg">
      <source src="video/film.mp4" type="video/mp4">
    </video>
    <span class="scroll-cue" aria-hidden="true"><i></i></span>
  </section>
  <div class="set">
  <header class="wall-head">
    <h1>Ephemeral</h1><span class="count">3</span>
  </header>
  <section class="wall shop-wall">
    <figure><a class="piece" href="#"><span class="placeholder-fill"></span><span class="over"><span class="name">Bearer of Small Things</span><span class="cost">$240</span></span></a></figure>
    <figure><a class="piece" href="#"><span class="placeholder-fill"></span><span class="over"><span class="name">Horn Ring</span><span class="cost">$380</span></span></a></figure>
    <figure><a class="piece" href="#"><span class="placeholder-fill"></span><span class="over"><span class="name">Egg of Quiet</span><span class="cost">$290</span></span></a></figure>
  </section>
  </div>

  <div class="set">
  <header class="wall-head next-set">
    <h1>Perennial</h1><span class="count">{{SHOPCOUNT}}</span>
  </header>
  <section class="wall shop-wall">
{{SHOPGRID}}
  </section>
  </div>
</main>

{{FOOTER}}
{{SITEJS}}
<script>
  (function () {
    var heads = [].slice.call(document.querySelectorAll('.wall-head'));
    var headH = function () { return document.querySelector('.head').offsetHeight; };
    if (!document.body.classList.contains('follow-titles')) return;          // feature switched off
    function check() {
      heads.forEach(function (h) {
        var t = h.querySelector('h1').getBoundingClientRect().top;
        h.classList.toggle('compact', t <= headH() + 2);          // stays small and white once it has started riding
      });
    }
    addEventListener('scroll', check, {passive: true}); addEventListener('resize', check); check();
  })();
</script>
<script>
  addEventListener('scroll', function () { document.querySelector('.film').classList.toggle('scrolled', scrollY > 40); }, {passive: true});
</script>
</body>
</html>
