<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bag | Studio Maçon</title>
<link rel="icon" href="img/favicon.png">
<link rel="stylesheet" href="site.css?v={{CSSV}}">
<style>
  .bag-page{max-width:1100px;margin:0 auto;padding:calc(var(--head) + 36px) calc(var(--pad) + 24px) 36px}
  .bag-page h1{margin:0 0 40px}
  .bag-grid{display:grid;gap:48px}
  .lines{border-top:1px solid var(--rule)}
  /* the lines themselves (.line, .qty) are shared with the desktop bag drawer: see site.css */
  .summary{align-self:start}
  .summary dl{display:grid;grid-template-columns:1fr auto;gap:12px 0;margin:0 0 24px;font-size:15px}
  .summary dd{margin:0;text-align:right;padding-left:18px}
  .summary .total{padding-top:14px;border-top:1px solid var(--rule);font-weight:500}          /* the same pale rule as under the title */
  .summary .note{text-align:center;margin:14px 0 0;font-size:13px;color:rgba(0,0,0,.5);line-height:1.5}
  .empty{padding:40px 0 0;text-align:left}
  .empty p{margin:0 0 28px;font-size:17px}
  .empty .cta{max-width:none;width:100%}
  @media (max-width:767px){ footer{display:none} .bag-page{padding-bottom:48px} }          /* phones: the page ends on the made-to-order note */          /* the same size as Checkout */
  /* nothing to check out: Checkout steps back to an outline */
  .empty .cta{background:none;color:#000;border:1px solid #000}          /* Checkout stays the black one */
  @media (min-width:900px){ .bag-grid{grid-template-columns:minmax(0,1fr) 340px;gap:64px} .summary{position:sticky;top:calc(var(--head) + 24px)} }
</style>
</head>
<body class="fit">

{{NAV}}

<main class="bag-page">
  <h1>Bag</h1>
  <div class="bag-grid" id="bag-grid" hidden>
    <section class="lines" id="lines" aria-label="Pieces in your bag"></section>
    <aside class="summary" aria-label="Order summary">
      <p class="label" style="margin:0 0 18px">Summary</p>
      <dl>
        <dt>Subtotal</dt><dd id="sub">$0</dd>
        <dt>Shipping</dt><dd class="ship-note">Free <span class="ship-sub">&#183; all US orders</span></dd>
        <dt class="total">Total</dt><dd class="total" id="total">$0</dd>
      </dl>
      <div id="gift"></div>
      <button class="cta" type="button" id="checkout">Checkout</button>
      <p class="note" data-ship-note>Every piece is made to order. Please allow up to 10 business days before it ships.</p>
    </aside>
  </div>
  <div class="empty" id="empty" hidden>
    <p>Your bag is empty.</p>
    <a class="cta" href="index.html">Continue Shopping</a>
  </div>
</main>

{{FOOTER}}
{{SITEJS}}
<script>
  (function () {
    var money = function (n) { return '$' + n.toLocaleString('en-US', {minimumFractionDigits: n % 1 ? 2 : 0}); };
    function render() {
      var items = MaconBag.read(), lines = document.getElementById('lines');
      document.getElementById('bag-grid').hidden = !items.length;
      document.getElementById('empty').hidden = !!items.length;
      document.body.classList.toggle('bag-empty', !items.length);
      var sub = MaconBagLines(lines);
      document.getElementById('sub').textContent = money(sub);
      document.getElementById('total').textContent = money(sub);
    }
    render(); document.addEventListener('bag:change', render);
  })();
  MaconGift.mount(document.getElementById('gift'));
  function shipNote() { var sn = document.querySelector('[data-ship-note]'); if (sn && window.maconShipNote) sn.textContent = maconShipNote(); }
  shipNote(); document.addEventListener('bag:change', shipNote);
  document.getElementById('checkout').addEventListener('click', function () {
    MaconCheckout(MaconBag.read(), this).catch(function () {});
  });
</script>
</body>
</html>
