<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact | Studio Maçon</title>
<link rel="icon" href="img/favicon.png">
<link rel="stylesheet" href="site.css?v={{CSSV}}">
<style>
  .split .pics figure{display:grid;place-items:center;aspect-ratio:4/5}
  .split .pics img{width:78%}
  .split .copy p.body{margin:0 0 48px;font-size:17px;line-height:1.55}
  .ways{display:flex;justify-content:center;align-items:baseline;gap:12px;margin:48px 0 0;font-size:calc(17px - 2pt)}
  .ways .dot{opacity:.5}
  /* desktop: email and Instagram sit together at the foot of the first screen, centred under the form column */
  .form{display:grid;gap:30px}
  .form .row{display:grid;grid-template-columns:1fr 1fr;gap:24px}
  .form .field{padding:0 0 10px;border-bottom:.5px solid #000}
  .form .field input,.form .field textarea{font-size:calc(17px - 2pt);opacity:.8}
  .form .field input::placeholder,.form .field textarea::placeholder{color:rgba(0,0,0,.35)}
  .form textarea{min-height:120px}
  .form .cta{margin-top:10px}
  .sent{margin:0;font-size:17px}
  @media (min-width:768px){
    .split .pics figure{aspect-ratio:auto;height:100vh}
    /* email and Instagram pinned to the foot of the screen, 1px off the bottom edge */
    .split .copy .ways{position:absolute;left:0;right:0;bottom:1px;margin:0}
  }
</style>
</head>
<body>

{{NAV}}

<main>
  <section class="split">
    <div class="pics">
      <figure><img src="img/pages/leaves.png" alt="Storybook illustration of bird of paradise leaves" fetchpriority="high"></figure>
    </div>

    <div class="copy">
      <a class="back" href="index.html" data-no-emerge><svg class="back-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg><span>Back to Shop</span></a>
      <p class="eyebrow">Say Hello</p>
      <h1>Contact</h1>
      <p class="body">Questions about a piece, an order, or a commission.<br>We read everything, and we'll write back.</p>


      <form class="form" onsubmit="event.preventDefault();this.outerHTML='<p class=&quot;sent&quot;>Sent, thanks!</p>'">
        <div class="row">
          <label class="field"><input name="first" placeholder="First Name" aria-label="First Name" required></label>
          <label class="field"><input name="last" placeholder="Last Name" aria-label="Last Name"></label>
        </div>
        <label class="field"><input type="email" name="email" placeholder="Email" aria-label="Email" required></label>
        <label class="field"><textarea name="message" placeholder="Message" aria-label="Message" required></textarea></label>
        <button class="cta">Send</button>
      </form>
      <p class="ways" data-no-emerge><a data-no-emerge class="hover-line" href="mailto:hello@studiomacon.co?subject=Hi%20there!">hello@studiomacon.co</a><span class="dot" data-no-emerge aria-hidden="true">•</span><a data-no-emerge class="hover-line" href="https://www.instagram.com/studiomacon/" target="_blank" rel="noopener">@studiomacon</a></p>
    </div>
  </section>
</main>

{{FOOTER}}
{{SITEJS}}
</body>
</html>
