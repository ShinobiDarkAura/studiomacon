<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact | Studio Maçon</title>
<link rel="icon" href="../assets/favicon.png">
<link rel="stylesheet" href="site.css?v={{CSSV}}">
<style>
  .split .pics figure{display:grid;place-items:center;aspect-ratio:4/5}
  .split .pics img{width:78%}
  .split .copy p.body{margin:0 0 36px;font-size:17px;line-height:1.55}
  .ways{display:grid;grid-template-columns:auto 1fr;gap:10px 28px;align-items:baseline;margin:0 0 48px}
  .ways a{font-size:17px}
  .form{display:grid;gap:30px}
  .form .row{display:grid;grid-template-columns:1fr 1fr;gap:24px}
  .form .field{padding-left:0}
  .form textarea{min-height:120px}
  .form .cta{margin-top:10px}
  .sent{margin:0;font-size:17px}
  @media (min-width:768px){ .split .pics figure{aspect-ratio:auto;height:100vh} }
</style>
</head>
<body>

{{NAV}}

<main>
  <section class="split">
    <div class="pics">
      <figure><img src="img/pages/leaves.png" alt="Storybook illustration of bird of paradise leaves" fetchpriority="high"></figure>
    </div>

    <div class="copy">
      <p class="eyebrow">Say Hello</p>
      <h1>Contact</h1>
      <p class="body">Questions about a piece, an order, or a commission. We read everything, and we'll write back.</p>

      <div class="ways">
        <span class="label">Email</span><a class="hover-line" href="mailto:hello@studiomacon.co?subject=Hi%20there!">hello@studiomacon.co</a>
        <span class="label">Instagram</span><a class="hover-line" href="https://www.instagram.com/studiomacon/" target="_blank" rel="noopener">@studiomacon</a>
      </div>

      <form class="form" onsubmit="event.preventDefault();this.outerHTML='<p class=&quot;sent&quot;>Sent, thanks!</p>'">
        <div class="row">
          <label class="field"><input name="first" placeholder="First Name" aria-label="First Name" required></label>
          <label class="field"><input name="last" placeholder="Last Name" aria-label="Last Name"></label>
        </div>
        <label class="field"><input type="email" name="email" placeholder="Email" aria-label="Email" required></label>
        <label class="field"><textarea name="message" placeholder="Message" aria-label="Message" required></textarea></label>
        <button class="cta">Send</button>
      </form>
    </div>
  </section>
</main>

{{FOOTER}}
{{SITEJS}}
</body>
</html>
