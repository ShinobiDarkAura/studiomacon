<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact | Studio Maçon</title>
<meta name="color-scheme" content="dark light">
<link rel="icon" href="img/favicon.png">
<link rel="stylesheet" href="site.css?v={{CSSV}}">
<style>
  /* the poster floats whole in the middle of a black field, never cropped */
  .split .pics figure{margin:0;background:#0d0c0b;display:grid;place-items:center;
    aspect-ratio:4/5;padding:6vh 4vw}
  .split .pics img{display:block;width:100%;height:100%;object-fit:contain}
  .split .copy{color-scheme:light}
  .split .copy p.body{margin:0 0 48px;font-size:17px;line-height:1.55}
  .ways{display:flex;justify-content:center;align-items:baseline;gap:12px;margin:48px 0 0;font-size:calc(17px - 2pt)}
  .ways .dot{opacity:.5}
  /* desktop: email and Instagram sit together at the foot of the first screen, centred under the form column */
  .form{display:grid;gap:30px}
  .form .row{display:grid;grid-template-columns:1fr 1fr;gap:24px}
  .form .field{padding:0 0 10px;border-bottom:.5px solid #000}
  .form .field input,.form .field textarea{font-size:calc(17px - 2pt);opacity:.8}
  .form .field input::placeholder,.form .field textarea::placeholder{color:rgba(0,0,0,.35)}
  .form textarea{min-height:120px}
  .form .cta{margin-top:10px}
  .sent{margin:0;font-size:17px}
  @media (min-width:768px){
    /* the black field is a true 70% of the screen */
    .split{grid-template-columns:70vw minmax(0,1fr)}
    .split{background:linear-gradient(to right,#0d0c0b 0 70vw,#fff 70vw)}
    .split .pics figure{aspect-ratio:auto;height:100vh;height:100svh}
    .split .pics img{max-height:73.7vh}
    /* email and Instagram sit at the foot of the column, 16px off the bottom edge */
    .split .copy .ways{position:absolute;left:0;right:0;bottom:17px;margin:0}
  }
</style>
</head>
<body>

{{NAV}}

<main>
  <section class="split">
    <div class="pics">
      <figure><img src="img/pages/reliques.jpg" alt="Maçon poster: a hand holding a small bronze horse" fetchpriority="high"></figure>
    </div>

    <div class="copy">
      <a class="back" href="index.html#pieces" data-no-emerge><svg class="back-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg><span>Back</span></a>
      <p class="eyebrow">Say Hello</p>
      <h1>Contact</h1>
      <p class="body">Questions about a piece, an order, or a commission.<br>We read everything, and we'll write back.</p>


      <form class="form" id="contact-form">
        <input type="text" name="company" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px">
        <div class="row">
          <label class="field"><input name="first" placeholder="First Name" aria-label="First Name" required></label>
          <label class="field"><input name="last" placeholder="Last Name" aria-label="Last Name"></label>
        </div>
        <label class="field"><input type="email" name="email" placeholder="Email" aria-label="Email" required></label>
        <label class="field"><textarea name="message" placeholder="Message" aria-label="Message" required></textarea></label>
        <button class="cta">Send</button>
      </form>
      <p class="ways" data-no-emerge><a data-no-emerge class="hover-line" href="mailto:hello@studiomacon.co?subject=Hi%20there!">hello@studiomacon.co</a><span class="dot" data-no-emerge aria-hidden="true">•</span><a data-no-emerge class="hover-line" href="https://www.instagram.com/studiomacon/" target="_blank" rel="noopener">@studiomacon</a></p>
    </div>
  </section>
</main>

{{FOOTER}}
{{SITEJS}}
<script>
  document.getElementById('contact-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var f = this, btn = f.querySelector('.cta'), v = function (n) { return (f.elements[n] || {}).value || ''; };
    btn.disabled = true; btn.textContent = 'Sending…';
    MaconEnquiry({form: 'contact', name: (v('first') + ' ' + v('last')).trim(), email: v('email'), message: v('message'), company: v('company')})
      .then(function () { f.outerHTML = '<p class="sent">Sent, thank you. A confirmation is on its way to your inbox.</p>'; })
      .catch(function () {
        btn.disabled = false; btn.textContent = 'Send';
        alert('Sorry, that didn\u2019t send. Please write to hello@studiomacon.co and we\u2019ll reply from there.');
      });
  });
</script>
</body>
</html>
