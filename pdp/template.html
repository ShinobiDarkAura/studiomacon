<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}} | Studio Maçon</title>
<link rel="icon" href="../assets/favicon.png">
<style>
  /* Instrument Serif, SIL Open Font License — self-hosted so the page never waits on Google */
  @font-face{font-family:"Instrument Serif";src:url(fonts/instrument-serif.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
  @font-face{font-family:"Instrument Serif";src:url(fonts/instrument-serif-italic.woff2) format("woff2");font-weight:400;font-style:italic;font-display:swap}
  :root{
    --ink:#000;
    --field:#f7f7f7;
    --rule:#e3e3e3;
    --serif:"Instrument Serif", "Times New Roman", serif;
    --sans:"Helvetica Neue", Helvetica, Arial, sans-serif;
    --pad:24px;
    --head:84px;
    --ease:cubic-bezier(.22,.7,.2,1);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:#fff;color:var(--ink);font:400 17px/1.5 var(--sans);letter-spacing:-.005em}
  img{display:block;max-width:100%;height:auto}
  a{color:inherit;text-decoration:none}
  button,select{font:inherit;color:inherit}
  button{background:none;border:0;padding:0;cursor:pointer}

  /* ── header: no background, ever ───────────────────── */
  .head{position:fixed;inset:0 0 auto;z-index:20;height:var(--head);pointer-events:none;
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 var(--pad);font-size:16px}
  .head > *{pointer-events:auto}
  .head .left{justify-self:start;display:flex;gap:28px;color:#fff;transition:color .3s ease}
  .head .mark img{filter:invert(1);transition:filter .3s ease}
  .head.ink .left{color:#000}
  .head.ink .mark img{filter:none}
  .head .right{justify-self:end;white-space:nowrap}
  .head .desk{display:none}
  .mark{display:block}
  .mark img{height:40px;width:auto}

  /* ── product ───────────────────────────────────────── */
  .gallery figure{margin:0;background:var(--field)}
  .gallery figure + figure{display:none}          /* mobile: hero only up top */
  .gallery .hero img{width:100%;aspect-ratio:4/5;object-fit:cover}

  .info{padding:28px var(--pad) 0;text-align:center}
  .eyebrow{font-size:15px;margin:0 0 10px}
  h1{font:400 46px/1 var(--serif);text-transform:uppercase;letter-spacing:-.005em;margin:0 0 14px}
  .price{font-size:19px;margin:0 0 18px}
  .size{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 12px;
    border:1px solid var(--rule);padding:0 0 0 16px;text-align:left}
  .size span{font-size:15px;text-transform:uppercase}
  .size select{border:0;background:transparent;height:52px;padding:0 16px;font-size:16px;cursor:pointer}
  .buy{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .cta,.apple-pay{display:flex;align-items:center;justify-content:center;width:100%;height:55px;
    background:#000;color:#fff;font-size:calc(18px - 2pt);text-transform:uppercase;letter-spacing:.08em}
  .apple-pay{gap:5px;text-transform:none;letter-spacing:-.01em;font:500 23px/1 -apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
  .apple-pay svg{width:19px;height:23px;margin-top:-3px;fill:#fff}
  /* Safari draws Apple's own button */
  @supports (-webkit-appearance:-apple-pay-button){
    .apple-pay{-webkit-appearance:-apple-pay-button;-apple-pay-button-type:plain;-apple-pay-button-style:black}
    .apple-pay > *{display:none}
  }
  .label{font-size:calc(17px - 2pt);letter-spacing:.12em;text-transform:uppercase;color:rgba(0,0,0,.5)}
  .desc-block{text-align:left;margin:42px 0 0;padding:0 0 42px;border-bottom:1px solid var(--rule)}
  .desc-block .label{margin:0 0 22px}
  .desc{margin:0;font-size:17px;line-height:1.55}

  /* accordions: height eases open and shut */
  .acc{text-align:left}
  .acc-item{border-bottom:1px solid var(--rule)}
  .acc-head{display:flex;width:100%;justify-content:space-between;align-items:center;
    padding:19px 0;font-size:calc(17px - 2pt);letter-spacing:.12em;text-transform:uppercase;text-align:left;color:rgba(0,0,0,.5)}
  .acc-head::after{content:"";width:13px;height:13px;flex:none;
    background:linear-gradient(currentColor,currentColor) center/13px 1.5px no-repeat,
               linear-gradient(currentColor,currentColor) center/1.5px 13px no-repeat;
    color:#000;opacity:.5;transition:transform .45s var(--ease),opacity .2s ease}
  .acc-head:hover::after{opacity:1}
  .acc-item.open .acc-head::after{transform:rotate(90deg);
    background:linear-gradient(currentColor,currentColor) center/1.5px 13px no-repeat}
  .acc-panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease)}
  .acc-item.open .acc-panel{grid-template-rows:1fr}
  .acc-inner{overflow:hidden}
  .acc-body{padding:0 0 20px;font-size:17px;line-height:1.55;opacity:0;transform:translateY(-6px);
    transition:opacity .35s ease,transform .5s var(--ease)}
  .acc-item.open .acc-body{opacity:1;transform:none;transition-delay:.08s}
  .acc-body p{margin:0 0 .9em}
  .acc-body p:last-child{margin:0}
  .acc-body a{text-decoration:underline;text-underline-offset:3px}
  .acc-body dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 18px}
  .acc-body dt{text-transform:uppercase;font-size:14px;padding-top:2px}
  .acc-body dd{margin:0}
  .acc-body .after-dl{margin-top:18px}
  .todo{background:#fff4c2;padding:0 3px}

  /* ── closing: big stacked images, two centred chunks ─ */
  .closing{padding:64px 0 0}
  .big{--w:min(calc((100% - 2 * var(--pad)) * 1.1), 100%);width:var(--w);margin-left:calc((100% - var(--w)) / 2);
    aspect-ratio:2.75/1;background:#d9d9d9}          /* 3:1 made 10% wider and 20% taller */
  .chunk{margin:96px auto;padding:0 calc(var(--pad) + 16px);max-width:620px;
    text-align:center;font-size:17px;line-height:1.55}

  /* ── footer ────────────────────────────────────────── */
  footer{--fine-gap:64px;padding:96px var(--pad) var(--fine-gap);text-align:center}
  footer .logotype{width:140px;aspect-ratio:888/331;margin:0 auto 56px;background:var(--ink);
    -webkit-mask:url(img/logotype.png) center/contain no-repeat;mask:url(img/logotype.png) center/contain no-repeat}
  footer .tag{font:400 32px/1.05 var(--serif);text-transform:uppercase;margin:0 0 56px}
  footer .news{max-width:560px;margin:0 auto}
  footer .news p{margin:0 0 30px;font-size:18px;line-height:1.45}
  footer form{display:flex;border-bottom:1.5px solid rgba(0,0,0,.25);padding:0 0 10px 18px}
  footer input{flex:1;border:0;outline:0;font:inherit;font-size:18px;background:none;min-width:0}
  footer input::placeholder{color:#777}
  footer form button{font-size:18px;padding:0 18px}
  footer .links{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 64px;margin:72px 0 0;font-size:17px}
  /* same gap above and below, so it sits centred between the links and the page edge */
  footer .fine{margin:var(--fine-gap) 0 0;font:400 32px/1.05 var(--serif);letter-spacing:.02em;text-transform:uppercase}

  /* ── sticky bag bar (mobile) ───────────────────────── */
  .dock{position:fixed;left:var(--pad);right:var(--pad);bottom:24px;z-index:15;
    display:flex;align-items:center;justify-content:center;gap:26px;height:84px;
    background:#fff;border:1.5px solid var(--ink);font-size:calc(18px - 1pt);letter-spacing:.08em;text-transform:uppercase;
    transform:translateY(140%);transition:transform .35s var(--ease)}
  .dock.on{transform:none}
  .dock span:last-child{text-transform:none}

  /* ── tablet / desktop ──────────────────────────────── */
  @media (min-width:768px){
    :root{--pad:40px;--head:110px}
    .head .mob{display:none}
    .head .desk{display:inline}
    .mark img{height:52px}

    .product{display:grid;grid-template-columns:minmax(0,62fr) minmax(0,38fr);gap:0 48px;
      margin:0 var(--pad) 0 0;align-items:start}
    .gallery figure + figure{display:block;margin-top:12px}
    .gallery figure img{width:100%}
    .gallery figure + figure img{aspect-ratio:4/5;object-fit:cover}

    /* transparent, pinned, and scrolls on its own when every accordion is open */
    .info{position:sticky;top:var(--head);height:calc(100vh - var(--head));overflow-y:auto;
      overscroll-behavior:contain;scrollbar-width:none;text-align:left;padding:24px 0 48px;
      display:flex;flex-direction:column;justify-content:safe center}
    .info > *{flex:none}
    .info::-webkit-scrollbar{display:none}
    .eyebrow{font-size:16px}
    h1{font-size:53px}

    .closing{max-width:1100px;margin:0 auto;padding:140px var(--pad) 0}
    .big{--w:110%}
    .chunk{margin:150px auto;max-width:620px;padding:0}

    footer{--fine-gap:80px;padding:140px var(--pad) var(--fine-gap)}
    .dock{display:none}
  }
  @media (min-width:1200px){
    h1{font-size:60px}
  }
</style>
</head>
<body>

<header class="head">
  <div class="left">
    <a href="#" class="mob">Menu</a>
    <a href="index.html" class="desk">Shop</a>
    <a href="../story.html" class="desk">Story</a>
    <a href="../custom.html" class="desk">Custom</a>
  </div>
  <a class="mark" href="index.html" aria-label="Studio Maçon"><img src="img/mark.gif" alt="Studio Maçon"></a>
  <div class="right"><a href="#">Bag (0)</a></div>
</header>

<main>
  <section class="product">
    <div class="gallery">
      <figure class="hero"><img src="{{HERO}}" alt="{{TITLE}}" fetchpriority="high"></figure>
      {{GALLERY}}
    </div>

    <div class="info">
      <p class="eyebrow">{{EYEBROW}}</p>
      <h1>{{TITLE}}</h1>
      <p class="price">{{PRICE}}</p>
      {{SIZE}}
      <div class="buy" id="bag">
        <button class="cta">Add to Bag</button>
        <button class="apple-pay" aria-label="Buy with Apple Pay"><svg viewBox="0 0 17 20" aria-hidden="true"><path d="M14.1 10.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9C3.5 4.8 1.8 5.9.9 7.5c-1.9 3.3-.5 8.1 1.3 10.8.9 1.3 2 2.7 3.3 2.7 1.3-.1 1.8-.9 3.4-.9s2 .9 3.4.8c1.4 0 2.3-1.3 3.2-2.6 1-1.5 1.4-2.9 1.4-3-.1 0-2.8-1-2.8-4.7ZM11.5 3c.7-.9 1.2-2 1.1-3.2-1 0-2.3.7-3 1.6-.7.8-1.3 2-1.1 3.1 1.1.1 2.3-.6 3-1.5Z"/></svg><span>Pay</span></button>
      </div>
      <div class="desc-block"><p class="label">Description</p><p class="desc">{{DESC}}</p></div>
      <div class="acc">
{{ACCORDIONS}}
      </div>
    </div>
  </section>

  <section class="closing">
    {{CLOSING}}
  </section>

</main>

<footer>
  <div class="logotype" role="img" aria-label="Maçon"></div>
  <div class="news">
    <p>Subscribe to hear about new pieces before anyone else, and the stories behind them.</p>
    <form onsubmit="event.preventDefault();this.querySelector('button').textContent='Thank you'">
      <input type="email" placeholder="Email address" aria-label="Email address" required>
      <button>Submit</button>
    </form>
  </div>
  <nav class="links">
    <a href="../story.html">Story</a>
    <a href="../custom.html">Custom</a>
    <a href="../shipping.html">Shipping &amp; Returns</a>
    <a href="mailto:hello@studiomacon.co">Contact</a>
  </nav>
  <p class="fine">Artifacts of Love, Made to Order.</p>
</footer>

<button class="dock" id="dock" aria-label="Add to Bag, {{PRICE}}"><span>Add to Bag</span><span>{{PRICE}}</span></button>

<script>
  // Accordions: the height eases through a grid-row transition, so nothing is
  // measured in script and a panel of any length opens at the same pace.
  document.querySelectorAll('.acc-head').forEach(function (b) {
    b.addEventListener('click', function () {
      var item = b.parentElement, open = !item.classList.contains('open');
      item.classList.toggle('open', open);
      b.setAttribute('aria-expanded', open);
    });
  });

  // The mark blinks once on load; hovering replays it. A GIF can't be rewound,
  // so alternate between two cached URLs to make the browser start it over.
  (function () {
    var link = document.querySelector('.mark'), img = link.querySelector('img');
    var base = img.getAttribute('src'), n = 0;
    link.addEventListener('mouseenter', function () { n ^= 1; img.src = base + '?b=' + n; });
  })();

  // Nav items are white while they sit over the photographs, and turn black
  // once the gallery has scrolled out from under them. Bag (0) stays black.
  (function () {
    var head = document.querySelector('.head'), gallery = document.querySelector('.gallery');
    function tone() { head.classList.toggle('ink', gallery.getBoundingClientRect().bottom < head.offsetHeight * 0.6); }
    addEventListener('scroll', tone, {passive: true}); addEventListener('resize', tone); tone();
  })();

  // The bag bar appears once the real button has scrolled away, and steps
  // aside at the footer so it never covers the newsletter.
  (function () {
    var dock = document.getElementById('dock'), gone = false, foot = false;
    function sync() { dock.classList.toggle('on', gone && !foot); }
    new IntersectionObserver(function (e) { gone = !e[0].isIntersecting && e[0].boundingClientRect.top < 0; sync(); })
      .observe(document.getElementById('bag'));
    new IntersectionObserver(function (e) { foot = e[0].isIntersecting; sync(); }, {rootMargin: '0px 0px -40% 0px'})
      .observe(document.querySelector('footer .news'));
  })();
</script>
</body>
</html>
