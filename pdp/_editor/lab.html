<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio Maçon — Lab</title>
<style>
  :root{--rule:#e2e0dc;--ink:#111;--soft:#767068;--bg:#faf9f7;--warn:#9a5b21;--field:#f1efec}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.55 ui-sans-serif,-apple-system,"Helvetica Neue",sans-serif}
  header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;
         padding:12px 22px;background:#fff;border-bottom:1px solid var(--rule)}
  header h1{margin:0;font-size:15px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
  .tabs{display:flex;gap:6px}
  .tabs button.on{background:#111;color:#fff;border-color:#111}
  .grow{flex:1}
  button,select{font:inherit;border:1px solid var(--rule);background:#fff;border-radius:7px;padding:6px 12px;cursor:pointer}
  button:hover{border-color:#999}
  button.primary{background:#111;color:#fff;border-color:#111}
  button.primary:disabled{opacity:.35;cursor:default}
  main{padding:22px 26px 80px}
  .pane{display:none}
  .pane.on{display:block}
  .msg{font-size:13px;color:var(--soft)}
  .msg.bad{color:#a11}
  .lb{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin:0 0 8px}

  /* --- product page lab --- */
  .lab{display:grid;grid-template-columns:330px minmax(0,1fr);gap:26px;align-items:start}
  .shots{background:#fff;border:1px solid var(--rule);border-radius:10px;padding:14px}
  .shot{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--rule)}
  .shot:first-of-type{border-top:0}
  .shot .th{width:54px;height:68px;object-fit:cover;border-radius:5px;background:var(--field)}
  .shot.off .th{opacity:.25}
  .shot{cursor:grab}
  .shot.drag{opacity:.35}
  .shot.over{box-shadow:0 -2px 0 #111 inset,0 2px 0 #111 inset}
  .shot .grip{color:var(--soft);letter-spacing:2px;font-size:13px;user-select:none}
  .shot .nm{font-size:12px;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .shot .btns{display:flex;gap:4px;margin:5px 0 4px;flex-wrap:wrap}
  .shot .btns button{padding:1px 7px;font-size:11px;border-radius:5px}
  .shot .btns button.on{background:#111;color:#fff;border-color:#111}
  .shot .sl{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--soft)}
  .shot input[type=range]{flex:1;margin:0}
  .stage{background:#fff;border:1px solid var(--rule);border-radius:10px;padding:18px;overflow:clip}
  /* a small true-to-life copy of the product page: pictures at 70, words at 30 */
  .mock{display:grid;grid-template-columns:70fr 30fr;gap:0 26px;align-items:start}
  .mock .pics figure{margin:0 0 8px;overflow:hidden;background:var(--field);border-radius:4px}
  .mock .pics img{display:block;width:100%}
  .mock .copy{position:sticky;top:72px}
  .greek{background:#ddd9d4;border-radius:3px;height:9px;margin:0 0 7px}
  .greek.t{height:26px;background:#c9c4be;margin-bottom:14px}
  .greek.s{width:40%}
  .greek.b{height:30px;background:#111;margin-top:18px;border-radius:4px}

  /* --- skeleton --- */
  .sk{background:#fff;border:1px solid var(--rule);border-radius:10px;padding:20px;
      display:grid;grid-template-columns:1fr 1fr;gap:24px}
  .sk .frame{border:1px solid var(--rule);border-radius:6px;overflow:clip;padding:10px;background:var(--bg)}
  .sk .bar{display:flex;gap:8px;align-items:center;margin-bottom:14px}
  .sk .bar .greek{height:7px;width:34px;margin:0}
  .sk .hero{height:150px;background:#111;border-radius:4px;margin-bottom:16px}
  .sk .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .sk .setname{display:flex;align-items:baseline;gap:6px;margin:18px 0 8px}
  .sk .setname b{font:600 13px/1 ui-sans-serif;letter-spacing:.04em;text-transform:uppercase}
  .sk .setname span{font-size:11px;color:var(--soft)}
  .sk .split{display:grid;grid-template-columns:70fr 30fr;gap:10px;align-items:start}
  .sk .split > div:last-child{position:sticky;top:72px}          /* the words stay with you, like the real page */
  .sk .hero{background-size:cover;background-position:center}
  .pick{position:fixed;inset:0;z-index:10;background:rgba(20,18,16,.55);display:none;place-items:center}
  .pick.on{display:grid}
  .pick .box{background:#fff;border-radius:10px;padding:18px;max-width:640px;max-height:80vh;overflow:auto}
  .pick .row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
  .pick .row img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px;cursor:pointer;border:2px solid transparent}
  .pick .row img:hover{border-color:#111}
  .sk .chips{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 12px}
  .sk .chips button{padding:2px 9px;font-size:11px;border-radius:20px}
  .sk .chips button.on{background:#111;color:#fff;border-color:#111}
  /* swapping a piece replays the page's own entrance, so the rhythm can be judged */
  @keyframes rise{from{opacity:0;transform:translateY(22px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
  .sk .playing .fb,.sk .playing .greek{animation:rise .62s cubic-bezier(.16,1,.3,1) both;animation-delay:var(--d,0ms)}
  /* every picture in the skeleton is framed exactly as the site frames it: cover, then pan and zoom */
  .fb{position:relative;overflow:hidden;border-radius:4px;background:#ddd9d4;touch-action:none}
  .fb.tile{aspect-ratio:4/5}
  /* on the real product page every picture fills one screen height at 70% of its width,
     so its frame takes the shape of this screen: the crop here is the crop there */
  .fb.lead{aspect-ratio:var(--screen-frame,1)}
  .fb.pic{aspect-ratio:var(--screen-frame-tall,.8)}          /* the pictures under the first run 20% taller */
  .fb img{display:block;width:100%;height:100%;object-fit:cover;cursor:grab;user-select:none;-webkit-user-drag:none}
  .fb.panning img{cursor:grabbing}
  .sk .split .p .fb{margin-bottom:6px}
  .fb .chg,.fb .zm,.fb .x,.fb .grip{position:absolute;z-index:3;opacity:0;transition:opacity .15s ease}
  .fb:hover .chg,.fb:hover .zm,.fb:hover .x,.fb:hover .grip{opacity:1}
  .fb .chg{left:6px;top:6px;padding:2px 8px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
     background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:4px}
  .fb .zm{left:8px;right:8px;bottom:8px;width:auto;margin:0;accent-color:#fff}
  /* colour balance for grid tiles: warm/cool and green/magenta, previewed live, baked in when the site is built */
  .fb .tn{position:absolute;z-index:3;left:8px;right:8px;bottom:34px;display:grid;gap:4px;opacity:0;transition:opacity .15s ease;
    font:500 9px/1 -apple-system,system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
  .fb:hover .tn{opacity:1}
  .fb .tn label{display:grid;grid-template-columns:62px 1fr 26px;align-items:center;gap:6px}
  .fb .tn input{width:100%;margin:0;accent-color:#fff}
  .fb .tn output{text-align:right}
  .fb .tn .tn-reset{justify-self:end;background:none;border:0;color:#fff;font:inherit;text-decoration:underline;cursor:pointer;padding:0}
  .fb .grip{right:6px;top:6px;width:26px;height:26px;display:grid;place-items:center;border-radius:5px;
     background:rgba(0,0,0,.6);color:#fff;font-size:14px;cursor:move}
  .fb.drag{opacity:.3}
  .fb.over{outline:2px solid #111;outline-offset:2px}
  /* the remove button: 1.5x, with the cross optically centred */
  .x{position:absolute;top:6px;right:6px;z-index:3;width:36px;height:36px;padding:0;border:0;border-radius:50%;
     background:rgba(0,0,0,.62);color:#fff;display:grid;place-items:center;cursor:pointer;opacity:0;transition:opacity .15s ease}
  .x svg{width:14px;height:14px;display:block}
  .x:hover{background:#a11}
  .mock .pics figure:hover .x{opacity:1}
  .mock .pics figure{position:relative}
  /* alignment guides */
  .guided{position:relative}
  .guides{position:absolute;inset:0;pointer-events:none;z-index:4}
  .gv{position:absolute;top:0;bottom:0;width:1px;background:rgba(225,0,0,.55)}
  .gh{position:absolute;left:0;right:0;height:1px;background:rgba(225,0,0,.55);pointer-events:auto;cursor:row-resize}
  .gh::before{content:"";position:absolute;left:0;right:0;top:-5px;height:11px}
  .sk .tools{display:flex;gap:14px;align-items:center;margin:0 0 14px;font-size:13px;color:var(--soft)}
  .sk .cap{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin:0 0 10px}
</style>
</head>
<body>
<header>
  <h1>Maçon Lab</h1>
  <div class="tabs">
    <button data-tab="skel" class="on">Skeleton</button>
    <button data-tab="page">Product page</button>
  </div>
  <span class="grow"></span>
  <span class="msg" id="msg">Loading…</span>
  <a href="/pdp/_editor/index.html"><button>Words editor</button></a>
</header>

<main>
  <!-- ————— tab one: try picture counts, order, framing ————— -->
  <section class="pane" id="pane-page">
    <p class="lb">
      <select id="piece"></select>
      <button id="addPhoto">Add a picture…</button>
      <input type="file" id="file" accept="image/*" hidden>
      <button id="reset">Back to the built-in set</button>
    </p>
    <div class="lab">
      <div class="shots" id="shots"></div>
      <div class="stage">
        <div class="mock" id="mock"></div>
      </div>
    </div>
  </section>

  <!-- ————— tab three: the shape of the site, no words ————— -->
  <section class="pane on" id="pane-skel">
    <div class="sk-tools-row">
      <p class="tools"><label><input type="checkbox" id="guides"> Guides</label>
        <span>red lines through each column's centre and across each row — drag the horizontal ones to line up the pieces</span></p>
    </div>
    <div class="sk">
      <div class="frame">
        <p class="cap">Home</p>
        <div class="bar"><span class="greek"></span><span class="greek"></span><span class="grow"></span><span class="greek" style="width:56px"></span></div>
        <div class="hero"></div>
        <div id="skSets"></div>
      </div>
      <div class="frame">
        <p class="cap">Product page</p>
        <div class="chips" id="skChips"></div>
        <div class="bar"><span class="greek"></span><span class="greek"></span><span class="grow"></span><span class="greek" style="width:56px"></span></div>
        <div class="split">
          <div class="p" id="skPics"></div>
          <div>
            <div class="greek s"></div><div class="greek t"></div>
            <div class="greek"></div><div class="greek"></div><div class="greek s"></div>
            <div class="greek b"></div>
            <div class="greek" style="margin-top:20px"></div><div class="greek"></div><div class="greek s"></div>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<div class="pick" id="pick"><div class="box">
  <p class="lb" id="pickTitle">Choose a picture</p>
  <button id="pickUpload">Add one from my drive…</button>
  <input type="file" id="pickFile" accept="image/*" hidden>
  <div class="row" id="pickRow"></div>
</div></div>

<script>
const $ = (s, r) => (r || document).querySelector(s);
const msg = (t, bad) => { const m = $('#msg'); m.textContent = t; m.className = 'msg' + (bad ? ' bad' : ''); };
let DATA = null, EDITS = {products: {}, pages: {}, shared: {}, stamp: {}}, slug = null;

/* tabs */
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.id === 'pane-' + b.dataset.tab));
});

/* ————— the piece being tried out ————— */
const piece = () => DATA.products.find(p => p.slug === slug);
const edit = () => (EDITS.products[slug] = EDITS.products[slug] || {});

function shown() {
  const p = piece(), e = EDITS.products[slug] || {};
  const hero = e.hero || p.defaults.hero;
  const gal = e.gallery || p.defaults.gallery;
  const hide = e.hidden || [];
  return [hero].concat(gal).filter((x, i, a) => a.indexOf(x) === i && hide.indexOf(x) < 0);
}
const frameOf = src => ((EDITS.products[slug] || {}).frames || {})[src] || {x: 50, y: 50, z: 1};

function draw() {
  const p = piece(), e = EDITS.products[slug] || {};
  const hero = e.hero || p.defaults.hero, hide = e.hidden || [];
  const order = [hero].concat(e.gallery || p.defaults.gallery)
                      .filter((x, i, a) => a.indexOf(x) === i);

  $('#shots').innerHTML = order.map((src, i) => {
    const f = frameOf(src), off = hide.indexOf(src) >= 0;
    return `<div class="shot${off ? ' off' : ''}" draggable="true" data-i="${i}">
      <img class="th" src="/pdp/${src}" alt="">
      <div>
        <div class="nm"><span class="grip">⠿</span> ${src.split('/').pop()}</div>
        <div class="btns">
          <button data-a="hero" data-i="${i}" class="${src === hero ? 'on' : ''}">First</button>
          <button data-a="up" data-i="${i}">↑</button>
          <button data-a="down" data-i="${i}">↓</button>
          <button data-a="hide" data-i="${i}" class="${off ? 'on' : ''}">${off ? 'Hidden' : 'Hide'}</button>
          <button data-a="drop" data-i="${i}">Remove</button>
        </div>
        <div class="sl">Zoom<input type="range" data-k="z" data-i="${i}" min="1" max="2.5" step="0.05" value="${f.z}"><b>${(+f.z).toFixed(2)}×</b></div>
        <div class="sl">↔<input type="range" data-k="x" data-i="${i}" min="0" max="100" value="${f.x}">
                       ↕<input type="range" data-k="y" data-i="${i}" min="0" max="100" value="${f.y}"></div>
      </div></div>`;
  }).join('') + spares();

  $('#mock').innerHTML = `<div class="pics">` + shown().map(src => {
    const f = frameOf(src);
    return `<figure><button class="x" data-src="${src}" title="Remove from the page" aria-label="Remove from the page"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button><img src="/pdp/${src}" style="transform:scale(${f.z});transform-origin:${f.x}% ${f.y}%"></figure>`;
  }).join('') + `</div>
    <div class="copy">
      <div class="greek s"></div><div class="greek t"></div>
      <div class="greek"></div><div class="greek"></div><div class="greek s"></div>
      <div class="greek b"></div>
      <div class="greek" style="margin-top:22px"></div><div class="greek"></div><div class="greek s"></div>
    </div>`;

  $('#shots').querySelectorAll('button').forEach(b => b.onclick = () => act(b.dataset.a, order, +b.dataset.i, b.dataset.src));
  dragging(order);
  if (DATA && window.skelReady && SETS.length) { skeleton(); chips(); }
  $('#shots').querySelectorAll('input[type=range]').forEach(r => r.oninput = () => {
    const src = order[+r.dataset.i], e2 = edit();
    e2.frames = e2.frames || {};
    e2.frames[src] = Object.assign({x: 50, y: 50, z: 1}, e2.frames[src], {[r.dataset.k]: +r.value});
    draw(); touched();
  });
}

// pictures the piece owns that are not on the page: still in the library, one click from returning
function spares() {
  const p = piece(), e = EDITS.products[slug] || {};
  const on = [e.hero || p.defaults.hero].concat(e.gallery || p.defaults.gallery);
  const off = p.photos.filter(x => on.indexOf(x) < 0);
  if (!off.length) return '';
  return `<p class="lb" style="margin:14px 0 4px">Not on the page</p>` + off.map(src =>
    `<div class="shot off"><img class="th" src="/pdp/${src}" alt="">
       <div><div class="nm">${src.split('/').pop()}</div>
         <div class="btns"><button data-a="back" data-src="${src}">Put back</button></div>
       </div></div>`).join('');
}

// pick a picture up and drop it where it belongs
let held = null;
function dragging(order) {
  $('#shots').querySelectorAll('.shot[draggable]').forEach(row => {
    row.ondragstart = e => { held = +row.dataset.i; row.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; };
    row.ondragend = () => { held = null; $('#shots').querySelectorAll('.shot').forEach(r => r.classList.remove('drag', 'over')); };
    row.ondragover = e => { e.preventDefault(); row.classList.add('over'); };
    row.ondragleave = () => row.classList.remove('over');
    row.ondrop = e => {
      e.preventDefault();
      const to = +row.dataset.i;
      if (held === null || held === to) return;
      const next = order.slice();
      next.splice(to, 0, next.splice(held, 1)[0]);
      const e2 = edit();
      e2.hero = next[0];
      e2.gallery = next.slice(1);
      held = null;
      draw(); skeleton(); touched();
    };
  });
}

function removeFromPage(src) {
  const e = edit(), p = piece();
  const order = [e.hero || p.defaults.hero].concat(e.gallery || p.defaults.gallery)
                .filter((x, k, a) => a.indexOf(x) === k);
  act('drop', order, order.indexOf(src), src);
}
document.addEventListener('click', ev => {
  const x = ev.target.closest && ev.target.closest('.x');
  if (!x) return;
  ev.stopPropagation();                                   // not the "Change" picker underneath
  removeFromPage(x.dataset.src);
  if (window.skelReady) skeleton();
}, true);

function act(a, order, i, src2) {
  const e = edit(), p = piece(), src = src2 || order[i];
  if (a === 'back') {
    e.gallery = (e.gallery || p.defaults.gallery).concat([src]);
    e.hero = e.hero || p.defaults.hero;
    draw(); touched(); return;
  }
  if (a === 'drop') {                                   // off the page, left in the library
    const rest = order.filter(x => x !== src);
    if (!rest.length) { msg('A piece needs at least one picture', true); return; }
    e.hero = rest[0];
    e.gallery = rest.slice(1);
    if (e.hidden) e.hidden = e.hidden.filter(x => x !== src);
    draw(); touched(); return;
  }
  if (a === 'hide') {
    e.hidden = e.hidden || [];
    const at = e.hidden.indexOf(src);
    at < 0 ? e.hidden.push(src) : e.hidden.splice(at, 1);
  } else if (a === 'hero') {
    e.hero = src;
    e.gallery = order.filter(x => x !== src);
  } else {
    const j = a === 'up' ? i - 1 : i + 1;
    if (j < 0 || j >= order.length) return;
    const next = order.slice();
    next.splice(j, 0, next.splice(i, 1)[0]);
    e.hero = next[0];
    e.gallery = next.slice(1);
  }
  draw(); touched();
}

// every change saves itself: a moment after the last touch, one at a time
let saveTimer = null, saving = false, again = false;
function touched() { msg('Saving…'); clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 900); }
async function saveNow() {
  if (saving) { again = true; return; }
  saving = true;
  try {
    const r = await fetch('/api/content', {method: 'POST', body: JSON.stringify(EDITS)});
    const j = await r.json();
    msg(j.error || 'Saved — publishing to the preview…', !!j.error);
    if (!j.error) watchPublish();
  } catch (e) { msg('Could not save — is the preview server running?', true); }
  saving = false;
  if (again) { again = false; saveNow(); }
}

// the preview redeploys by itself after each save; say so once it is live
let watching = null;
function watchPublish() {
  clearInterval(watching);
  watching = setInterval(async () => {
    if (saving || saveTimer && msg && document.querySelector('#msg').textContent === 'Saving…') return;
    try {
      const p = await (await fetch('/api/publish')).json();
      if (p.state === 'running') { msg('Saved — publishing to the preview…'); return; }
      clearInterval(watching);
      msg(p.error ? 'Saved here, but publishing failed — tell Claude' : 'Live on the preview · ' + p.last, !!p.error);
    } catch (e) { clearInterval(watching); }
  }, 3000);
}

/* ————— picture from the studio's own drive ————— */
$('#addPhoto').onclick = () => $('#file').click();
$('#file').onchange = async () => {
  const f = $('#file').files[0]; if (!f) return;
  msg('Adding ' + f.name + '…');
  const r = await fetch('/api/photo?slug=' + slug + '&name=' + encodeURIComponent(f.name),
                        {method: 'POST', body: f});
  const j = await r.json();
  if (j.error) return msg(j.error, true);
  const e = edit();
  e.gallery = (e.gallery || piece().defaults.gallery).concat([j.added]);
  piece().photos.push(j.added);
  $('#file').value = '';
  draw(); touched();
};

$('#reset').onclick = () => {
  const e = EDITS.products[slug] || {};
  delete e.hero; delete e.gallery; delete e.hidden; delete e.frames;
  draw(); touched();
};

/* ————— the skeleton, with the real pictures in place ————— */
let picking = null;                                   // {slug, apply(src)}

window.skelReady = true;
let SETS = [];                                        // the home page's own sets, read off the built page

async function readSets() {
  try {
    const doc = new DOMParser().parseFromString(await (await fetch('/pdp/index.html')).text(), 'text/html');
    SETS = [].slice.call(doc.querySelectorAll('.set')).map(set => ({
      name: (set.querySelector('.set-title') || {}).textContent || '',
      slugs: [].slice.call(set.querySelectorAll('.wall figure a.piece'))
               .map(a => a.getAttribute('href').replace('.html', '')),
    })).filter(s => s.slugs.length);
  } catch (e) { SETS = [{name: 'Pieces', slugs: DATA.products.map(p => p.slug)}]; }
}

const X_SVG = '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
const tileFrame = sl => Object.assign({x: 50, y: 50, z: 1.12, warm: 0, tint: 0}, (EDITS.products[sl] || {}).tile);
// the same colour balance the build bakes in (build_pdp.tint_gains), shown live through an SVG colour matrix
const gains = (w, t) => [1 + w * .01 - t * .005, 1 + t * .01, 1 - w * .01 - t * .005];
function tintFilter(sl, f) {
  let svg = document.getElementById('tn-defs');
  if (!svg) { svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); svg.id = 'tn-defs'; svg.setAttribute('width', 0); svg.setAttribute('height', 0); svg.style.position = 'absolute'; document.body.appendChild(svg); }
  const id = 'tn-' + sl; let fl = svg.querySelector('#' + id);
  if (!fl) { fl = document.createElementNS('http://www.w3.org/2000/svg', 'filter'); fl.id = id; fl.setAttribute('color-interpolation-filters', 'sRGB');
    fl.innerHTML = '<feColorMatrix type="matrix"/>'; svg.appendChild(fl); }
  const [r, g, b] = gains(+f.warm || 0, +f.tint || 0);
  fl.firstChild.setAttribute('values', `${r} 0 0 0 0  0 ${g} 0 0 0  0 0 ${b} 0 0  0 0 0 1 0`);
  return (+f.warm || +f.tint) ? `url(#${id})` : 'none';
}
const picFrame = (sl, src) => Object.assign({x: 50, y: 50, z: 1}, ((EDITS.products[sl] || {}).frames || {})[src]);
const look = f => `object-position:${f.x}% ${f.y}%;transform-origin:${f.x}% ${f.y}%;transform:scale(${f.z})`;

function box(kind, sl, src, f, extra) {
  return `<div class="fb ${kind}" data-kind="${kind === 'lead' ? 'pic' : kind}" data-slug="${sl}" data-src="${src}" ${extra || ''}>
    <img src="/pdp/${src}" style="${look(f)}" draggable="false" alt="">
    <button class="chg">Change</button>
    ${kind === 'tile' ? '<span class="grip" draggable="true" title="Drag to reorder">⠿</span>'
                      : `<button class="x" data-src="${src}" title="Remove from the page" aria-label="Remove from the page">${X_SVG}</button>`}
    <input class="zm" type="range" min="1" max="2.5" step="0.01" value="${f.z}" title="Zoom">
    ${kind === 'tile' ? `<div class="tn">
      <label>Cool ↔ Warm<input type="range" data-tn="warm" min="-20" max="20" step="0.5" value="${f.warm || 0}"><output>${f.warm || 0}</output></label>
      <label>Mag. ↔ Green<input type="range" data-tn="tint" min="-20" max="20" step="0.5" value="${f.tint || 0}"><output>${f.tint || 0}</output></label>
      <button type="button" class="tn-reset">reset colour</button></div>` : ''}
  </div>`;
}

function skeleton() {
  $('#skSets').innerHTML = SETS.map((set, si) => `<div class="setname"><b>${set.name}</b><span>${set.slugs.length}</span></div>
    <div class="tiles guided">` + set.slugs.map(sl => {
      const p = DATA.products.find(x => x.slug === sl);
      if (!p) return '<div class="fb tile"></div>';
      const e = EDITS.products[sl] || {};
      return box('tile', sl, e.hero || p.defaults.hero, tileFrame(sl), `data-set="${si}"`);
    }).join('') + `</div>`).join('');

  const list = shown();
  $('#skPics').classList.add('guided');
  $('#skPics').innerHTML = list.map((src, i) => box(i === 0 ? 'lead' : 'pic', slug, src, picFrame(slug, src), `data-i="${i}"`)).join('');

  $('#pane-skel').querySelectorAll('.fb.tile').forEach(fb => { fb.querySelector('img').style.filter = tintFilter(fb.dataset.slug, tileFrame(fb.dataset.slug)); });
  $('#pane-skel').querySelectorAll('.fb img').forEach(im => { if (!im.complete) im.onload = guides; });
  guides();
}

// ── one set of handlers for every framed picture ──
const pane = $('#pane-skel');
function fbFrame(fb) { return fb.dataset.kind === 'tile' ? tileFrame(fb.dataset.slug) : picFrame(fb.dataset.slug, fb.dataset.src); }
function keep(fb, f) {
  const e = EDITS.products[fb.dataset.slug] = EDITS.products[fb.dataset.slug] || {};
  if (fb.dataset.kind === 'tile') e.tile = f;
  else { e.frames = e.frames || {}; e.frames[fb.dataset.src] = f; }
  if (fb.dataset.slug === slug) draw();
}

// colour balance (tiles): preview while dragging, keep on release
pane.addEventListener('input', ev => {
  const r = ev.target.closest && ev.target.closest('[data-tn]'); if (!r) return;
  const fb = r.closest('.fb'), f = fb._f || fbFrame(fb);
  f[r.dataset.tn] = +r.value; r.nextElementSibling.textContent = r.value;
  fb.querySelector('img').style.filter = tintFilter(fb.dataset.slug, f); fb._f = f;
});
pane.addEventListener('change', ev => {
  const r = ev.target.closest && ev.target.closest('[data-tn]'); if (!r) return;
  const fb = r.closest('.fb'); if (fb._f) { keep(fb, fb._f); touched(); }
});
pane.addEventListener('click', ev => {
  const b = ev.target.closest && ev.target.closest('.tn-reset'); if (!b) return;
  const fb = b.closest('.fb'), f = fbFrame(fb); f.warm = 0; f.tint = 0;
  fb.querySelectorAll('[data-tn]').forEach(x => { x.value = 0; x.nextElementSibling.textContent = '0'; });
  fb.querySelector('img').style.filter = tintFilter(fb.dataset.slug, f); keep(fb, f); touched();
});

// zoom
pane.addEventListener('input', ev => {
  if (!ev.target.classList.contains('zm')) return;
  const fb = ev.target.closest('.fb'), f = fbFrame(fb);
  f.z = +ev.target.value;
  fb.querySelector('img').style.cssText = look(f);
  if (fb.dataset.kind === 'tile') fb.querySelector('img').style.filter = tintFilter(fb.dataset.slug, f);          // keep the colour preview
  fb._f = f;
});
pane.addEventListener('change', ev => {
  if (!ev.target.classList.contains('zm')) return;
  const fb = ev.target.closest('.fb');
  if (fb._f) { keep(fb, fb._f); touched(); }
});

// pan: drag the picture inside its frame
pane.addEventListener('pointerdown', ev => {
  const im = ev.target.closest('.fb img');
  if (!im || ev.button !== 0) return;
  const fb = im.closest('.fb'), f = fbFrame(fb), r = fb.getBoundingClientRect();
  const sx = ev.clientX, sy = ev.clientY, x0 = f.x, y0 = f.y;
  const k = 100 / Math.max(0.35, f.z - 1 + 0.35);          // steadier when barely zoomed
  fb.classList.add('panning'); im.setPointerCapture(ev.pointerId);
  const move = e => {
    f.x = Math.max(0, Math.min(100, x0 - (e.clientX - sx) / r.width * k));
    f.y = Math.max(0, Math.min(100, y0 - (e.clientY - sy) / r.height * k));
    f.x = Math.round(f.x * 10) / 10; f.y = Math.round(f.y * 10) / 10;
    im.style.cssText = look(f);
    if (fb.dataset.kind === 'tile') im.style.filter = tintFilter(fb.dataset.slug, f);
  };
  const up = () => {
    im.removeEventListener('pointermove', move); im.removeEventListener('pointerup', up);
    fb.classList.remove('panning');
    if (f.x !== x0 || f.y !== y0) { keep(fb, f); touched(); }
  };
  im.addEventListener('pointermove', move); im.addEventListener('pointerup', up);
});

// swap for another picture
pane.addEventListener('click', ev => {
  const b = ev.target.closest('.chg'); if (!b) return;
  const fb = b.closest('.fb'), sl = fb.dataset.slug;
  if (fb.dataset.kind === 'tile') {
    openPick(sl, src => { (EDITS.products[sl] = EDITS.products[sl] || {}).hero = src; skeleton(); draw(); touched(); });
  } else {
    const was = fb.dataset.src;
    openPick(sl, src => {
      const e = edit(), p = piece();
      const order = [e.hero || p.defaults.hero].concat(e.gallery || p.defaults.gallery).filter((x, k, a) => a.indexOf(x) === k);
      const at = order.indexOf(was);
      if (at >= 0) order[at] = src;
      e.hero = order[0]; e.gallery = order.slice(1);
      skeleton(); draw(); touched();
    });
  }
});

// reorder the home grid by its handle, within its own set
let gHeld = null;
pane.addEventListener('dragstart', ev => {
  const g = ev.target.closest && ev.target.closest('.grip'); if (!g) return;
  gHeld = g.closest('.fb'); gHeld.classList.add('drag');
  ev.dataTransfer.effectAllowed = 'move'; ev.dataTransfer.setDragImage(gHeld, 20, 20);
});
pane.addEventListener('dragend', () => { gHeld = null; pane.querySelectorAll('.fb').forEach(x => x.classList.remove('drag', 'over')); });
pane.addEventListener('dragover', ev => {
  const t = ev.target.closest && ev.target.closest('.fb.tile');
  if (t && gHeld && t.dataset.set === gHeld.dataset.set) { ev.preventDefault(); t.classList.add('over'); }
});
pane.addEventListener('dragleave', ev => { const t = ev.target.closest && ev.target.closest('.fb'); if (t) t.classList.remove('over'); });
pane.addEventListener('drop', ev => {
  const t = ev.target.closest && ev.target.closest('.fb.tile');
  if (!t || !gHeld || t === gHeld || t.dataset.set !== gHeld.dataset.set) return;   // a totem stays a totem
  ev.preventDefault();
  const set = SETS[+t.dataset.set].slugs;
  set.splice(set.indexOf(t.dataset.slug), 0, set.splice(set.indexOf(gHeld.dataset.slug), 1)[0]);
  EDITS.order = SETS.reduce((all, st) => all.concat(st.slugs), []);
  gHeld = null;
  skeleton(); touched();
});

// ── alignment guides ──
const hLines = {};                                         // where each dragged horizontal sits, by row
function guides() {
  pane.querySelectorAll('.guides').forEach(g => g.remove());
  if (!$('#guides').checked) return;
  pane.querySelectorAll('.guided').forEach((wrap, w) => {
    const boxes = [].slice.call(wrap.querySelectorAll(':scope > .fb'));
    if (!boxes.length) return;
    const W = wrap.getBoundingClientRect(), g = document.createElement('div');
    g.className = 'guides';
    const cols = [...new Set(boxes.map(b => Math.round(b.getBoundingClientRect().left)))];
    cols.forEach(left => {
      const b = boxes.find(x => Math.round(x.getBoundingClientRect().left) === left).getBoundingClientRect();
      g.insertAdjacentHTML('beforeend', `<i class="gv" style="left:${b.left - W.left + b.width / 2}px"></i>`);
    });
    const rows = [...new Set(boxes.map(b => Math.round(b.getBoundingClientRect().top)))];
    rows.forEach((top, r) => {
      const b = boxes.find(x => Math.round(x.getBoundingClientRect().top) === top).getBoundingClientRect();
      [0.38, 0.72].forEach((at, n) => {
        const key = w + ':' + r + ':' + n;
        const y = hLines[key] != null ? hLines[key] * b.height : at * b.height;
        g.insertAdjacentHTML('beforeend',
          `<i class="gh" data-key="${key}" data-top="${b.top - W.top}" data-h="${b.height}" style="top:${b.top - W.top + y}px"></i>`);
      });
    });
    wrap.appendChild(g);
  });
}
$('#guides').onchange = () => { try { localStorage.setItem('lab-guides', $('#guides').checked ? '1' : ''); } catch (e) {} guides(); };
try { $('#guides').checked = !!localStorage.getItem('lab-guides'); } catch (e) {}
function screenFrame() {
  // the product page's picture column: 70% of the width less its margins, by the full height
  const w = innerWidth * 0.7 - 60, h = innerHeight;
  document.documentElement.style.setProperty('--screen-frame', (w / h).toFixed(3));
  document.documentElement.style.setProperty('--screen-frame-tall', (w / (h * 1.2)).toFixed(3));
}
screenFrame();
addEventListener('resize', () => { screenFrame(); guides(); });
pane.addEventListener('pointerdown', ev => {
  const h = ev.target.closest('.gh'); if (!h) return;
  ev.stopPropagation(); ev.preventDefault();
  const sy = ev.clientY, y0 = parseFloat(h.style.top), top = +h.dataset.top, ht = +h.dataset.h;
  h.setPointerCapture(ev.pointerId);
  const move = e => {
    const y = Math.max(top, Math.min(top + ht, y0 + e.clientY - sy));
    h.style.top = y + 'px';
    hLines[h.dataset.key] = (y - top) / ht;
  };
  const up = () => { h.removeEventListener('pointermove', move); h.removeEventListener('pointerup', up); };
  h.addEventListener('pointermove', move); h.addEventListener('pointerup', up);
}, true);

// the row of pieces above the product page: swapping replays the entrance
function chips() {
  $('#skChips').innerHTML = DATA.products.map(p =>
    `<button data-slug="${p.slug}" class="${p.slug === slug ? 'on' : ''}">${p.defaults.name}</button>`).join('');
  $('#skChips').querySelectorAll('button').forEach(b => b.onclick = () => {
    slug = b.dataset.slug;
    $('#piece').value = slug;
    draw(); skeleton(); play();
  });
}

function play() {
  const frame = $('#skPics').closest('.frame');
  frame.classList.remove('playing');
  void frame.offsetWidth;                                   // restart the run
  [].slice.call(frame.querySelectorAll('.fb, .greek')).forEach((el, i) => el.style.setProperty('--d', i * 70 + 'ms'));
  frame.classList.add('playing');
}

function openPick(forSlug, apply) {
  const p = DATA.products.find(x => x.slug === forSlug);
  picking = {slug: forSlug, apply};
  $('#pickTitle').textContent = 'Pictures of ' + p.defaults.name;
  $('#pickRow').innerHTML = p.photos.map(src => `<img src="/pdp/${src}" data-src="${src}" alt="">`).join('');
  $('#pickRow').querySelectorAll('img').forEach(im => im.onclick = () => { apply(im.dataset.src); closePick(); });
  $('#pick').classList.add('on');
}
function closePick() { $('#pick').classList.remove('on'); picking = null; }
$('#pick').onclick = e => { if (e.target.id === 'pick') closePick(); };
$('#pickUpload').onclick = () => $('#pickFile').click();
$('#pickFile').onchange = async () => {
  const f = $('#pickFile').files[0]; if (!f || !picking) return;
  const to = picking.slug, apply = picking.apply;
  msg('Adding ' + f.name + '…');
  const r = await fetch('/api/photo?slug=' + to + '&name=' + encodeURIComponent(f.name), {method: 'POST', body: f});
  const j = await r.json();
  $('#pickFile').value = '';
  if (j.error) return msg(j.error, true);
  DATA.products.find(x => x.slug === to).photos.push(j.added);
  apply(j.added); closePick(); touched();
};

/* ————— load ————— */
(async () => {
  const r = await fetch('/api/editor');
  DATA = await r.json();
  if (DATA.error) return msg(DATA.error, true);
  EDITS.stamp = DATA.stamp || {}; EDITS.pages = DATA.pages || {};
  if (DATA.order && DATA.order.length) EDITS.order = DATA.order.slice();
  DATA.products.forEach(p => { if (Object.keys(p.edits || {}).length) EDITS.products[p.slug] = JSON.parse(JSON.stringify(p.edits)); });
  $('#piece').innerHTML = DATA.products.map(p => `<option value="${p.slug}">${p.defaults.name}</option>`).join('');
  $('#piece').onchange = () => { slug = $('#piece').value; draw(); skeleton(); chips(); play(); };
  slug = DATA.products[0].slug;
  await readSets();
  draw(); skeleton(); chips(); play(); msg('');
})();
</script>
</body>
